name: Claude Code Review

on:
  pull_request:
    # Not on every push (synchronize) to control cost. Comment "@claude review" to re-run.
    types: [opened, ready_for_review, reopened]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Uses the repo's own subagents (.claude/agents/) so local and CI reviews share one rubric.
          prompt: |
            Review PR ${{ github.repository }}#${{ github.event.pull_request.number }}.
            1. Get the diff with `gh pr diff ${{ github.event.pull_request.number }}`.
            2. In parallel, delegate to the `code-reviewer` and `security-reviewer` subagents, passing each the PR number.
            3. Post each blocker/should-fix/critical/high/medium finding as an inline comment on the relevant line.
               Skip nits and low-severity findings unless there are no other findings.
            4. If there are no findings, post nothing.
          claude_args: >-
            --allowedTools "Agent,Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
