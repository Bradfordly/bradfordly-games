name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, catches newly published CVEs in unchanged deps

permissions:
  contents: read

jobs:
  osv-scanner:
    # Dependency CVEs from the OSV database (aggregates GHSA, NVD, ecosystem advisories).
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --recursive
        --allow-no-lockfiles
        ./

  trivy:
    # CVEs, leaked secrets, and IaC misconfigurations (incl. CloudFormation from `cdk synth`).
    # Pinned by SHA: trivy-action tags were hijacked in March 2026 (CVE-2026-33634).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: infra/.trivyignore.yaml
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"

      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy
